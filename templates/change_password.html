
{% extends "base.html" %}
{% block title %}Chanje modpas — Kat Fidelite{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Chanje modpas</h1>
  <p class="subtitle">Mete modpas aktyèl ou, epi chwazi yon nouvo.</p>

  <form method="post" class="form card-form">
    <label for="current_password">Modpas aktyèl</label>
    <input type="password" id="current_password" name="current_password" required autofocus>

    <label for="new_password">Nouvo modpas</label>
    <input type="password" id="new_password" name="new_password" required minlength="6">

    <label for="confirm_password">Konfime nouvo modpas</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

    <button type="submit" class="btn btn-primary">Chanje modpas</button>
  </form>
</div>
{% endblock %}
