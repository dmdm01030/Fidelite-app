
{% extends "base.html" %}
{% block title %}Modifye {{ client.full_name }} — Kat Fidelite{% endblock %}
{% block content %}
<div class="narrow">
  <p class="eyebrow"><a href="{{ url_for('client_detail', client_id=client.id) }}" class="link-quiet">← Retounen</a></p>
  <h1>Modifye kliyan</h1>

  <form method="post" class="form card-form">
    <label for="full_name">Non konplè</label>
    <input type="text" id="full_name" name="full_name" value="{{ client.full_name }}" required autofocus>

    <label for="phone">Nimewo telefòn</label>
    <input type="tel" id="phone" name="phone" value="{{ client.phone or '' }}" placeholder="Egzanp: 37123456">

    <button type="submit" class="btn btn-primary">Sove chanjman</button>
  </form>
</div>
{% endblock %}
